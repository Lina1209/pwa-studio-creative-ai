name: Feature branch tests

on:
  push:
    branches:
      - feature/character-library-foundation
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  backend-unit-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r backend/requirements.txt
      - name: Run backend unit tests
        working-directory: backend
        run: python -m unittest discover -s tests -v
      - name: Check media cleanup race harness syntax
        if: always()
        run: |
          bash -n supabase/tests/0019_media_cleanup_claim_race.sh
          bash -n supabase/tests/0019_media_cleanup_reference_race.sh
          bash -n supabase/tests/0019_media_cleanup_batch_race.sh

  media-cleanup-postgres-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: pwa_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d pwa_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DISPOSABLE_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/pwa_test
      PWA_TEST_OWNER_ID: 11111111-1111-4111-8111-111111111111
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install PostgreSQL client
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client
      - name: Bootstrap disposable Supabase-compatible schema
        run: |
          psql "$DISPOSABLE_DATABASE_URL" -X -v ON_ERROR_STOP=1 \
            -f supabase/tests/0019_disposable_supabase_bootstrap.sql
          psql "$DISPOSABLE_DATABASE_URL" -X -v ON_ERROR_STOP=1 \
            -c "insert into auth.users(id,email) values ('$PWA_TEST_OWNER_ID','cleanup-test@example.invalid')"
      - name: Apply feature migrations to disposable PostgreSQL
        run: |
          for migration in \
            supabase/migrations/0005_cloud_projects_and_storage.sql \
            supabase/migrations/0009_user_profiles.sql \
            supabase/migrations/0012_character_library_media_links.sql \
            supabase/migrations/0017_owner_scoped_media_associations.sql \
            supabase/migrations/0018_private_media_upload_reservation.sql \
            supabase/migrations/0019_private_media_cleanup_outbox.sql \
            supabase/migrations/0020_character_local_identity.sql \
            supabase/migrations/0021_profile_avatar_catalog.sql \
            supabase/migrations/0022_ai_budget_reservations.sql \
            supabase/migrations/0023_character_versioned_updates.sql \
            supabase/migrations/0024_character_cursor_pagination_index.sql; do
            echo "Applying $migration"
            psql "$DISPOSABLE_DATABASE_URL" -X -v ON_ERROR_STOP=1 -f "$migration"
          done
      - name: Verify profile avatar catalog migration and defaults
        run: |
          psql "$DISPOSABLE_DATABASE_URL" -X -v ON_ERROR_STOP=1 \
            -v PWA_TEST_OWNER_ID="$PWA_TEST_OWNER_ID" \
            -f supabase/tests/0021_profile_avatar_catalog.sql
      - name: Verify AI budget reservation RPCs and ledger
        run: |
          psql "$DISPOSABLE_DATABASE_URL" -X -v ON_ERROR_STOP=1 \
            -v PWA_TEST_OWNER_ID="$PWA_TEST_OWNER_ID" \
            -f supabase/tests/0022_ai_budget_reservations.sql
      - name: Run concurrent AI budget reservation race harness
        run: bash supabase/tests/0022_ai_budget_reservation_race.sh
      - name: Run character idempotency transaction harness
        run: |
          psql "$DISPOSABLE_DATABASE_URL" -X -v ON_ERROR_STOP=1 \
            -v PWA_TEST_OWNER_ID="$PWA_TEST_OWNER_ID" \
            -f supabase/tests/0020_character_local_identity.sql
      - name: Verify versioned character update RPC
        run: |
          psql "$DISPOSABLE_DATABASE_URL" -X -v ON_ERROR_STOP=1 \
            -v PWA_TEST_OWNER_ID="$PWA_TEST_OWNER_ID" \
            -f supabase/tests/0023_character_versioned_updates.sql
      - name: Race concurrent character version updates
        run: bash supabase/tests/0023_character_versioned_update_race.sh
      - name: Run cleanup transaction and rollback harness
        run: |
          psql "$DISPOSABLE_DATABASE_URL" -X -v ON_ERROR_STOP=1 \
            -v PWA_TEST_OWNER_ID="$PWA_TEST_OWNER_ID" \
            -f supabase/tests/0019_media_cleanup_transaction.sql
      - name: Run two-worker claim race harness
        run: bash supabase/tests/0019_media_cleanup_claim_race.sh
      - name: Run adversarial reference-write race harness
        run: bash supabase/tests/0019_media_cleanup_reference_race.sh
      - name: Run 50-event five-worker cleanup stress harness
        run: bash supabase/tests/0019_media_cleanup_batch_race.sh

  character-backup-journal-browser-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Playwright
        run: |
          python -m pip install --upgrade pip
          python -m pip install playwright
          python -m playwright install --with-deps chromium
      - name: Run real-browser IndexedDB backup journal tests
        run: python tests/browser/run_character_backup_journal.py
      - name: Run real-browser durable restore checkpoint journal tests
        run: python tests/browser/run_character_restore_journal.py
      - name: Run real-browser restore coordinator integration tests
        run: python tests/browser/run_character_restore_coordinator.py
      - name: Check frontend syntax and account-switch fencing
        run: |
          node --check profile-avatar-catalog.js
          node --check app.js
          node --check audio-lab.js
          node --check character-cloud-restore.js
          node --check character-restore-journal.js
          node --check character-restore-coordinator.js
          node --check character-local-storage-adapter.js
          node tests/test_character_cloud_restore.js
          node tests/test_character_local_storage_adapter.js
          node tests/test_character_cloud_restore_adapter_integration.js
          node tests/test_character_restore_coordinator.js
          node tests/test_profile_avatar_catalog.js
          node tests/test_katty_expression_manifest.js
          node tests/test_katty_2d_layer_manifest.js
          python tests/test_character_library_account_fencing.py
          python tests/test_profile_avatar_picker_contract.py
