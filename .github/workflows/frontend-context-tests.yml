name: Frontend account-context tests

on:
  pull_request:
  push:
    branches:
      - main
      - fix/supabase-key-compat-2026-11-23

jobs:
  movie-cloud-context:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run account-context regression tests
        run: node --check app.js && node --check movie-cloud-operations.js && node --test tests-frontend/movie-cloud-context.test.js tests-frontend/movie-cloud-operations.test.js tests-frontend/admin-analytics-ui.test.js tests-frontend/service-worker-shell.test.js tests-frontend/movie-version-history.test.js tests-frontend/api-origin-guard.test.cjs
