name: Disposable PostgreSQL rate-limit and wallet tests

on:
  push:
    branches:
      - "fix/**"
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  rate-limit-rpc:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16.4
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: pwa_rpc_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d pwa_rpc_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PWA_RPC_TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/pwa_rpc_test
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install isolated integration-test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest "psycopg[binary]>=3.2,<4"
      - name: Run rate-limit and wallet migration integration tests
        run: pytest -q backend/tests/integration/test_rate_limit_rpc_postgres.py
