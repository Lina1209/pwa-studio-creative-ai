name: Repository quality checks

on:
  push:
  pull_request:

jobs:
  syntax-and-manifest:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check JavaScript syntax
        run: |
          node --check app.js
          node --check audio-lab.js
          node --check sw.js
      - name: Check Python syntax
        run: python -m compileall -q backend/app
      - name: Validate PWA manifest JSON
        run: python -m json.tool manifest.webmanifest > /dev/null
