name: Repository quality checks

on:
  push:
  pull_request:

jobs:
  syntax-and-manifest:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check JavaScript syntax
        run: |
          node --check app.js
          node --check movie-storage.js
          node --check audio-lab.js
          node --check sw.js
      - name: Install backend test dependencies
        run: pip install -r backend/requirements-dev.txt
      - name: Check Python syntax
        run: python -m compileall -q backend/app
      - name: Run backend unit tests
        working-directory: backend
        env:
          PYTHONPATH: ${{ github.workspace }}/backend
        run: pytest -q
      - name: Validate PWA manifest JSON
        run: python -m json.tool manifest.webmanifest > /dev/null

  postgres-migration-integration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: studio_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d studio_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Install PostgreSQL client
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client
      - name: Apply migrations and verify ownership, RLS, outbox, and delete behavior
        env:
          PGPASSWORD: postgres
        run: |
          psql -h localhost -U postgres -d studio_test -v ON_ERROR_STOP=1 -f supabase/tests/generation_jobs_migration_test.sql
      - name: Verify administrative audit resource allowlist and append-only journal
        env:
          PGPASSWORD: postgres
        run: |
          psql -h localhost -U postgres -d studio_test -v ON_ERROR_STOP=1 -f supabase/tests/admin_audit_migration_test.sql

      - name: Verify payment order idempotency and merchant reference integrity
        env:
          PGPASSWORD: postgres
        run: |
          psql -h localhost -U postgres -d studio_test -v ON_ERROR_STOP=1 -f supabase/tests/payment_order_migration_test.sql

      - name: Verify exactly-once payment entitlement fulfillment
        env:
          PGPASSWORD: postgres
        run: |
          psql -h localhost -U postgres -d studio_test -v ON_ERROR_STOP=1 -f supabase/tests/payment_fulfillment_integration_test.sql

      - name: Verify site visit deduplication, rate limits, and storage privacy
        env:
          PGPASSWORD: postgres
        run: |
          psql -h localhost -U postgres -d studio_test -v ON_ERROR_STOP=1 -f supabase/tests/site_visit_analytics_test.sql
      - name: Verify concurrent provider budget reservations cannot overbook exposure
        env:
          PGPASSWORD: postgres
        run: |
          set -euo pipefail
          DB=(psql -h localhost -U postgres -d studio_test -v ON_ERROR_STOP=1 -At)
          JOB_A="$("${DB[@]}" -c "select job_id from public.create_generation_job_with_outbox(
            '11111111-1111-4111-8111-111111111111', null,
            'image_generation', 'budget-race-provider', 'budget-race-model',
            'global-budget-concurrent-a', repeat('a', 64),
            '{\"prompt\":\"budget race A\"}'::jsonb,
            '{\"maximum_provider_cost_usd\":\"0.10\"}'::jsonb
          );")"
          JOB_B="$("${DB[@]}" -c "select job_id from public.create_generation_job_with_outbox(
            '11111111-1111-4111-8111-111111111111', null,
            'image_generation', 'budget-race-provider', 'budget-race-model',
            'global-budget-concurrent-b', repeat('b', 64),
            '{\"prompt\":\"budget race B\"}'::jsonb,
            '{\"maximum_provider_cost_usd\":\"0.10\"}'::jsonb
          );")"
          test -n "$JOB_A"
          test -n "$JOB_B"
          "${DB[@]}" -c "update public.generation_jobs
            set status = 'running',
                attempt_count = 1,
                lease_owner = case when id = '$JOB_A' then 'budget-race-worker-a' else 'budget-race-worker-b' end,
                lease_expires_at = now() + interval '120 seconds',
                heartbeat_at = now(),
                updated_at = now()
            where id in ('$JOB_A', '$JOB_B');"
          "${DB[@]}" -c "select public.configure_provider_budget_policy(1.00, 0.10);"

          FIRST_OUTPUT="$(mktemp)"
          "${DB[@]}" -c "begin;
            select public.authorize_generation_provider_operation('$JOB_A', 'budget-race-worker-a');
            select pg_sleep(4);
            commit;" > "$FIRST_OUTPUT" &
          FIRST_PID=$!
          trap 'kill "$FIRST_PID" 2>/dev/null || true; rm -f "$FIRST_OUTPUT"' EXIT
          sleep 1
          SECOND_OUTPUT="$("${DB[@]}" -c "select public.authorize_generation_provider_operation('$JOB_B', 'budget-race-worker-b');")"
          wait "$FIRST_PID"
          FIRST_RESULT="$(grep -E '^[tf]' "$FIRST_OUTPUT" | head -n 1)"
          if { [ "$FIRST_RESULT" = "t" ] && [ "$SECOND_OUTPUT" = "f" ]; } || { [ "$FIRST_RESULT" = "f" ] && [ "$SECOND_OUTPUT" = "t" ]; }; then
            :
          else
            echo "Concurrent provider admissions did not produce exactly one success and one denial."
            cat "$FIRST_OUTPUT"
            echo "Second admission: $SECOND_OUTPUT"
            exit 1
          fi
          RESERVATION_COUNT="$("${DB[@]}" -c "select count(*) from public.generation_provider_cost_reservations
            where job_id in ('$JOB_A', '$JOB_B') and status = 'reserved';")"
          test "$RESERVATION_COUNT" = "1"
          ADMITTED_JOB="$("${DB[@]}" -c "select job_id from public.generation_provider_cost_reservations
            where job_id in ('$JOB_A', '$JOB_B') and status = 'reserved' limit 1;")"
          "${DB[@]}" -c "select public.resolve_generation_provider_reservation(
            '$ADMITTED_JOB', 'budget-race-cleanup-001', 'release_no_charge', null,
            'Concurrent fixture was never submitted to a provider.'
          );"
          "${DB[@]}" -c "select public.configure_provider_budget_policy(null, null);"
          rm -f "$FIRST_OUTPUT"
          trap - EXIT

      - name: Verify concurrent workers cannot claim the same job
        env:
          PGPASSWORD: postgres
        run: |
          set -euo pipefail
          DB=(psql -h localhost -U postgres -d studio_test -v ON_ERROR_STOP=1 -At)
          JOB_ID="$("${DB[@]}" -c "select job_id from public.create_generation_job_with_outbox(
            '11111111-1111-4111-8111-111111111111', null,
            'image_generation', 'test-provider', 'test-model',
            'concurrent-claim-test-1', repeat('9', 64),
            '{\"prompt\":\"concurrency test\"}'::jsonb, '{}'::jsonb
          );")"
          test -n "$JOB_ID"
          # The preceding migration suite intentionally leaves an idempotency fixture queued.
          # Isolate this race test so both workers compete for exactly one eligible row.
          "${DB[@]}" -c "update public.generation_jobs
            set status = 'failed', lease_owner = null, lease_expires_at = null,
                heartbeat_at = null, completed_at = now(), updated_at = now()
            where id <> '$JOB_ID'
              and (
                status in ('queued', 'retry_wait')
                or (status = 'running' and lease_expires_at <= now())
              );"

          FIRST_OUTPUT="$(mktemp)"
          "${DB[@]}" -c "begin;
            select job_id from public.claim_next_generation_job('worker-concurrent-a', 120);
            select pg_sleep(4);
            commit;" > "$FIRST_OUTPUT" &
          FIRST_PID=$!
          trap 'kill "$FIRST_PID" 2>/dev/null || true; rm -f "$FIRST_OUTPUT"' EXIT

          # Give worker A time to claim and hold the row lock inside its transaction.
          sleep 1
          SECOND_OUTPUT="$("${DB[@]}" -c "select job_id from public.claim_next_generation_job('worker-concurrent-b', 120);")"
          wait "$FIRST_PID"
          grep -q "$JOB_ID" "$FIRST_OUTPUT"
          if [ -n "$SECOND_OUTPUT" ]; then
            echo "A concurrent worker unexpectedly claimed a second job: $SECOND_OUTPUT"
            exit 1
          fi

          ATTEMPT_COUNT="$("${DB[@]}" -c "select attempt_count from public.generation_jobs where id = '$JOB_ID';")"
          LEASE_OWNER="$("${DB[@]}" -c "select lease_owner from public.generation_jobs where id = '$JOB_ID';")"
          test "$ATTEMPT_COUNT" = "1"
          test "$LEASE_OWNER" = "worker-concurrent-a"
          rm -f "$FIRST_OUTPUT"
          trap - EXIT

      - name: Verify concurrent provider journal begin is idempotent
        env:
          PGPASSWORD: postgres
        run: |
          set -euo pipefail
          DB=(psql -h localhost -U postgres -d studio_test -v ON_ERROR_STOP=1 -At)
          JOB_ID="$("${DB[@]}" -c "select job_id from public.create_generation_job_with_outbox(
            '11111111-1111-4111-8111-111111111111', null,
            'image_generation', 'journal-race-provider', 'journal-race-model',
            'provider-journal-race-job-001', repeat('8', 64),
            '{\"prompt\":\"provider journal race\"}'::jsonb, '{}'::jsonb
          );")"
          test -n "$JOB_ID"
          "${DB[@]}" -c "update public.generation_jobs
            set status = 'failed', lease_owner = null, lease_expires_at = null,
                heartbeat_at = null, completed_at = now(), updated_at = now()
            where id <> '$JOB_ID'
              and (
                status in ('queued', 'retry_wait')
                or (status = 'running' and lease_expires_at <= now())
              );"
          CLAIMED="$("${DB[@]}" -c "select job_id from public.claim_next_generation_job('journal-race-worker', 120);")"
          test "$CLAIMED" = "$JOB_ID"

          FIRST_OUTPUT="$(mktemp)"
          "${DB[@]}" -c "begin;
            select created from public.begin_generation_provider_operation(
              '$JOB_ID', 'journal-race-worker', 'journal-race-provider', '$JOB_ID'
            );
            select pg_sleep(4);
            commit;" > "$FIRST_OUTPUT" &
          FIRST_PID=$!
          trap 'kill "$FIRST_PID" 2>/dev/null || true; rm -f "$FIRST_OUTPUT"' EXIT
          sleep 1
          SECOND_CREATED="$("${DB[@]}" -c "select created from public.begin_generation_provider_operation(
            '$JOB_ID', 'journal-race-worker', 'journal-race-provider', '$JOB_ID'
          );")"
          wait "$FIRST_PID"
          FIRST_CREATED="$(grep -E '^(t|f)$' "$FIRST_OUTPUT" | head -n 1)"
          test "$FIRST_CREATED" = "t"
          test "$SECOND_CREATED" = "f"
          OPERATION_COUNT="$("${DB[@]}" -c "select count(*) from public.generation_provider_operations where job_id = '$JOB_ID';")"
          test "$OPERATION_COUNT" = "1"
          rm -f "$FIRST_OUTPUT"
          trap - EXIT

      - name: Verify concurrent pricing quote creation is idempotent
        env:
          PGPASSWORD: postgres
        run: |
          set -euo pipefail
          DB=(psql -h localhost -U postgres -d studio_test -v ON_ERROR_STOP=1 -At)
          FIRST_OUTPUT="$(mktemp)"
          "${DB[@]}" -c "begin;
            select quote_snapshot->>'quote_id' || ':' || created::text
              from public.store_generation_pricing_quote(
                'aaaaaaaa-1111-4111-8111-111111111111',
                '11111111-1111-4111-8111-111111111111',
                'pricing-concurrent-key-001', repeat('c', 64),
                'image_generation', 'pricing-race-provider', 'pricing-race-model',
                null, null,
                jsonb_build_object(
                  'quote_id', 'aaaaaaaa-1111-4111-8111-111111111111',
                  'user_id', '11111111-1111-4111-8111-111111111111',
                  'idempotency_key', 'pricing-concurrent-key-001',
                  'request_hash', repeat('c', 64),
                  'job_type', 'image_generation',
                  'provider', 'pricing-race-provider',
                  'model', 'pricing-race-model',
                  'quantity', 1,
                  'project_id', null,
                  'studio_scene_id', null,
                  'expires_at', now() + interval '5 minutes'
                ),
                now() + interval '5 minutes'
              );
            select pg_sleep(4);
            commit;" > "$FIRST_OUTPUT" &
          FIRST_PID=$!
          trap 'kill "$FIRST_PID" 2>/dev/null || true; rm -f "$FIRST_OUTPUT"' EXIT
          sleep 1
          SECOND_OUTPUT="$("${DB[@]}" -c "select quote_snapshot->>'quote_id' || ':' || created::text
            from public.store_generation_pricing_quote(
              'bbbbbbbb-2222-4222-8222-222222222222',
              '11111111-1111-4111-8111-111111111111',
              'pricing-concurrent-key-001', repeat('c', 64),
              'image_generation', 'pricing-race-provider', 'pricing-race-model',
              null, null,
              jsonb_build_object(
                'quote_id', 'bbbbbbbb-2222-4222-8222-222222222222',
                'user_id', '11111111-1111-4111-8111-111111111111',
                'idempotency_key', 'pricing-concurrent-key-001',
                'request_hash', repeat('c', 64),
                'job_type', 'image_generation',
                'provider', 'pricing-race-provider',
                'model', 'pricing-race-model',
                'quantity', 1,
                'project_id', null,
                'studio_scene_id', null,
                'expires_at', now() + interval '5 minutes'
              ),
              now() + interval '5 minutes'
            );")"
          wait "$FIRST_PID"
          FIRST_RESULT="$(grep -F ':true' "$FIRST_OUTPUT" | head -n 1)"
          test "$FIRST_RESULT" = "aaaaaaaa-1111-4111-8111-111111111111:true"
          test "$SECOND_OUTPUT" = "aaaaaaaa-1111-4111-8111-111111111111:false"
          rm -f "$FIRST_OUTPUT"
          trap - EXIT

      - name: Verify concurrent provider cost events are idempotent
        env:
          PGPASSWORD: postgres
        run: |
          set -euo pipefail
          DB=(psql -h localhost -U postgres -d studio_test -v ON_ERROR_STOP=1 -At)
          JOB_ID="$("${DB[@]}" -c "select job_id from public.create_generation_job_with_outbox(
            '11111111-1111-4111-8111-111111111111', null,
            'image_generation', 'cost-race-provider', 'cost-race-model',
            'provider-cost-race-job-001', repeat('7', 64),
            '{\"prompt\":\"provider cost race\"}'::jsonb, '{}'::jsonb
          );")"
          test -n "$JOB_ID"
          "${DB[@]}" -c "update public.generation_jobs
            set pricing_snapshot = '{\"maximum_provider_cost_usd\":0.10}'::jsonb
            where id = '$JOB_ID';"

          FIRST_OUTPUT="$(mktemp)"
          "${DB[@]}" -c "begin;
            select event_id::text || ':' || case when created then 't' else 'f' end
              from public.record_generation_provider_cost(
                '$JOB_ID', '11111111-1111-4111-8111-111111111111',
                'provider-cost-race-op-001', 'cost-race-provider', 'cost-race-model',
                'provider-cost-race-usage-001', 0.01, 'reported',
                10, 5, 15, 'token', '{}'::jsonb
              );
            select pg_sleep(4);
            commit;" > "$FIRST_OUTPUT" &
          FIRST_PID=$!
          trap 'kill "$FIRST_PID" 2>/dev/null || true; rm -f "$FIRST_OUTPUT"' EXIT
          sleep 1
          SECOND_OUTPUT="$("${DB[@]}" -c "select event_id::text || ':' || case when created then 't' else 'f' end
            from public.record_generation_provider_cost(
              '$JOB_ID', '11111111-1111-4111-8111-111111111111',
              'provider-cost-race-op-001', 'cost-race-provider', 'cost-race-model',
              'provider-cost-race-usage-001', 0.01, 'reported',
              10, 5, 15, 'token', '{}'::jsonb
            );")"
          wait "$FIRST_PID"
          FIRST_RESULT="$(grep -E '^[0-9]+:t' "$FIRST_OUTPUT" | head -n 1)"
          test -n "$FIRST_RESULT"
          EXPECTED_SECOND="$(printf '%s' "$FIRST_RESULT" | sed 's/:t/:f/')"
          test "$SECOND_OUTPUT" = "$EXPECTED_SECOND"
          EVENT_COUNT="$("${DB[@]}" -c "select count(*) from public.generation_provider_cost_events where job_id = '$JOB_ID';")"
          test "$EVENT_COUNT" = "1"
          rm -f "$FIRST_OUTPUT"
          trap - EXIT


      - name: Verify concurrent source-separated credit grants are idempotent
        env:
          PGPASSWORD: postgres
        run: |
          set -euo pipefail
          DB=(psql -h localhost -U postgres -d studio_test -v ON_ERROR_STOP=1 -At)
          USER_ID="77777777-7777-4777-8777-777777777777"
          "${DB[@]}" -c "insert into auth.users(id) values ('$USER_ID') on conflict (id) do nothing;"
          FIRST_OUTPUT="$(mktemp)"
          "${DB[@]}" -c "begin;
            select replayed from public.grant_user_credit_lot(
              '$USER_ID', 10, 'bonus', 'concurrent-grant-source',
              'concurrent-credit-grant-001', '2099-01-01T00:00:00Z',
              '{\"test_case\":\"concurrent-grant-replay\"}'::jsonb
            );
            select pg_sleep(4);
            commit;" > "$FIRST_OUTPUT" &
          FIRST_PID=$!
          trap 'kill "$FIRST_PID" 2>/dev/null || true; rm -f "$FIRST_OUTPUT"' EXIT
          sleep 1
          SECOND_RESULT="$("${DB[@]}" -c "select replayed from public.grant_user_credit_lot(
            '$USER_ID', 10, 'bonus', 'concurrent-grant-source',
            'concurrent-credit-grant-001', '2099-01-01T00:00:00Z',
            '{\"test_case\":\"concurrent-grant-replay\"}'::jsonb
          );")"
          wait "$FIRST_PID"
          FIRST_RESULT="$(grep -E '^(t|f)$' "$FIRST_OUTPUT" | head -n 1)"
          test "$FIRST_RESULT" = "f"
          test "$SECOND_RESULT" = "t"
          LOT_COUNT="$("${DB[@]}" -c "select count(*) from public.credit_lots where user_id = '$USER_ID' and idempotency_key = 'concurrent-credit-grant-001';")"
          GRANT_COUNT="$("${DB[@]}" -c "select count(*) from public.credit_ledger where user_id = '$USER_ID' and operation_key = 'grant:concurrent-credit-grant-001';")"
          AVAILABLE="$("${DB[@]}" -c "select available_credits from public.credit_wallets where user_id = '$USER_ID';")"
          test "$LOT_COUNT" = "1"
          test "$GRANT_COUNT" = "1"
          test "$AVAILABLE" = "10"
          rm -f "$FIRST_OUTPUT"
          trap - EXIT

      - name: Verify concurrent reservations cannot overspend one wallet
        env:
          PGPASSWORD: postgres
        run: |
          set -euo pipefail
          DB=(psql -h localhost -U postgres -d studio_test -v ON_ERROR_STOP=1 -At)
          USER_ID="77777777-7777-4777-8777-777777777777"
          JOB_A="$("${DB[@]}" -c "select job_id from public.create_generation_job_with_outbox(
            '$USER_ID', null, 'image_generation', 'credit-race-provider', 'credit-race-model',
            'concurrent-credit-reserve-job-a', repeat('a', 64),
            '{\"prompt\":\"concurrent reserve A\"}'::jsonb, '{}'::jsonb
          );")"
          JOB_B="$("${DB[@]}" -c "select job_id from public.create_generation_job_with_outbox(
            '$USER_ID', null, 'image_generation', 'credit-race-provider', 'credit-race-model',
            'concurrent-credit-reserve-job-b', repeat('b', 64),
            '{\"prompt\":\"concurrent reserve B\"}'::jsonb, '{}'::jsonb
          );")"
          test -n "$JOB_A"
          test -n "$JOB_B"
          FIRST_OUTPUT="$(mktemp)"
          "${DB[@]}" -c "begin;
            select hold_id from public.reserve_job_credits(
              '$USER_ID', '$JOB_A', 7, 'concurrent-credit-reserve-a',
              '{\"price_version\":\"race-v1\",\"approved_maximum\":7}'::jsonb
            );
            select pg_sleep(4);
            commit;" > "$FIRST_OUTPUT" &
          FIRST_PID=$!
          trap 'kill "$FIRST_PID" 2>/dev/null || true; rm -f "$FIRST_OUTPUT"' EXIT
          sleep 1
          if SECOND_ERROR="$("${DB[@]}" -c "select hold_id from public.reserve_job_credits(
            '$USER_ID', '$JOB_B', 7, 'concurrent-credit-reserve-b',
            '{\"price_version\":\"race-v1\",\"approved_maximum\":7}'::jsonb
          );" 2>&1)"; then
            echo "A second concurrent reservation unexpectedly overspent the wallet."
            echo "$SECOND_ERROR"
            exit 1
          fi
          echo "$SECOND_ERROR" | grep -qi "insufficient"
          wait "$FIRST_PID"
          HELD_COUNT="$("${DB[@]}" -c "select count(*) from public.credit_holds where user_id = '$USER_ID' and status = 'held';")"
          ALLOCATION_COUNT="$("${DB[@]}" -c "select count(*) from public.credit_hold_allocations a join public.credit_holds h on h.id = a.hold_id where h.user_id = '$USER_ID' and a.status = 'held';")"
          AVAILABLE="$("${DB[@]}" -c "select available_credits from public.credit_wallets where user_id = '$USER_ID';")"
          RESERVED="$("${DB[@]}" -c "select reserved_credits from public.credit_wallets where user_id = '$USER_ID';")"
          JOB_B_HOLDS="$("${DB[@]}" -c "select count(*) from public.credit_holds where job_id = '$JOB_B';")"
          test "$HELD_COUNT" = "1"
          test "$ALLOCATION_COUNT" = "1"
          test "$AVAILABLE" = "3"
          test "$RESERVED" = "7"
          test "$JOB_B_HOLDS" = "0"
          rm -f "$FIRST_OUTPUT"
          trap - EXIT
