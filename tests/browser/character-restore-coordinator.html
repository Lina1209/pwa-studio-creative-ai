<!doctype html><html><head><meta charset="utf-8"><title>Restore coordinator browser integration</title></head><body><pre id="results">Running</pre>
<script src="../../character-restore-journal.js"></script><script src="../../character-restore-blob-store.js"></script><script src="../../character-restore-coordinator.js"></script>
<script>
(async()=>{
 const out=document.getElementById("results"),passed=[];
 const api=window.PWACharacterRestoreJournal, coordinator=window.PWACharacterRestoreCoordinator;
 const uuid=()=>crypto.randomUUID(), bytes=new TextEncoder().encode("browser integration image bytes");
 const blob=new Blob([bytes],{type:"image/png"});
 const digest=async b=>Array.from(new Uint8Array(await crypto.subtle.digest("SHA-256",await b.arrayBuffer())),x=>x.toString(16).padStart(2,"0")).join("");
 const ok=(v,m)=>{if(!v)throw Error(m)};
 const rejects=async(fn,m)=>{let yes=false;try{await fn()}catch{yes=true}ok(yes,m)};
 const test=async(n,fn)=>{await fn();passed.push(n)};
 const owner=uuid(), sha=await digest(blob);
 const gate={plan:Object.freeze({}),preview:Object.freeze({}),confirmation:Object.freeze({}),validateConfirmation:()=>true};
 async function planned(){
  const operationId=uuid();
  await api.create({ownerId:owner,operationId,localBaseFingerprint:sha,snapshotId:"browser-snapshot",selectedCharacterIds:[]});
  let lease=await api.acquireLease(owner,operationId);
  let row=await api.get(owner,operationId);
  row=await api.checkpoint({ownerId:owner,operationId,leaseToken:lease.token,leaseEpoch:lease.epoch,expectedRevision:row.revision,state:"planned"});
  await api.releaseLease(owner,operationId,lease);
  row=await api.get(owner,operationId);
  return {operationId,revision:row.revision};
 }
 function adapters({tamper=false,onDownload=()=>{}}={}){
  const blobs=new Map();
  return {
   async downloadAsset(){onDownload();return blob},
   async inspectImage(){return {width:40,height:30}},
   async stageBlob(x){blobs.set(x.localStagedBlobId,x.blob);return {localStagedBlobId:x.localStagedBlobId}},
   async readStagedBlob(x){return tamper?new Blob(["modified"],{type:"image/png"}):blobs.get(x.localStagedBlobId)}
  };
 }
 const characterId=uuid(),sourceLocalId=uuid(),localReferenceId=sourceLocalId+"-aaaaaaaa-aaaa-4aaa-8aaa-aaaaaaaaaaaa";
 const manifest=[{cloudAssetId:uuid(),characterId,sourceLocalId,localReferenceId,name:"front.png",type:"image/png",expectedSha256:sha,expectedSizeBytes:blob.size,expectedMimeType:"image/png",width:40,height:30}];
 try{
  await test("missing or invalid confirmation is rejected before journal access or download",async()=>{
   const op=await planned();let downloads=0,reads=0;
   const media=adapters({onDownload:()=>downloads++});
   const journal={get:async(...args)=>{reads++;return api.get(...args)},acquireLease:api.acquireLease,checkpoint:api.checkpoint,releaseLease:api.releaseLease,renewLease:api.renewLease};
   await rejects(()=>coordinator.stageRestoreReferences({ownerId:owner,operationId:op.operationId,manifest,expectedRevision:op.revision,journal,plan:{},preview:{},confirmation:{},validateConfirmation:()=>false,adapters:media}),"invalid confirmation was accepted");
   await rejects(()=>coordinator.stageRestoreReferences({ownerId:owner,operationId:op.operationId,manifest,expectedRevision:op.revision,journal,adapters:media}),"missing confirmation was accepted");
   ok(downloads===0&&reads===0,"invalid confirmation reached journal or media adapter");
  });
  await test("confirmation is revalidated after asynchronous boundaries",async()=>{
   const op=await planned();let valid=true,downloads=0;
   const media=adapters({onDownload:()=>{downloads++;valid=false}});
   await rejects(()=>coordinator.stageRestoreReferences({ownerId:owner,operationId:op.operationId,manifest,expectedRevision:op.revision,journal:api,...gate,validateConfirmation:()=>valid,adapters:media}),"confirmation invalidation during download was ignored");
   ok(downloads===1,"expected exactly one download before invalidation");
   const row=await api.get(owner,op.operationId);
   ok(row.state==="paused_retryable"&&row.lease===null,"invalidated confirmation did not pause and release safely");
  });
  await test("renewal remains fenced after a lease takeover",async()=>{
   const op=await planned();
   const old=await api.acquireLease(owner,op.operationId,{ttlMs:5000});
   const db=await new Promise((resolve,reject)=>{const q=indexedDB.open("pwa-studio-character-restore-journal-v1",1);q.onsuccess=()=>resolve(q.result);q.onerror=()=>reject(q.error)});
   try{await new Promise((resolve,reject)=>{const tx=db.transaction("operations","readwrite"),s=tx.objectStore("operations"),q=s.get(owner+":"+op.operationId);q.onsuccess=()=>{const r=q.result;r.lease.expiresAt=new Date(Date.now()-1000).toISOString();s.put(r)};tx.oncomplete=resolve;tx.onerror=()=>reject(tx.error)})}finally{db.close()}
   const fresh=await api.acquireLease(owner,op.operationId,{ttlMs:5000});
   await rejects(()=>api.renewLease(owner,op.operationId,old),"stale holder renewed a taken-over lease");
   ok(fresh.epoch===old.epoch+1,"takeover did not advance lease epoch");
   await api.releaseLease(owner,op.operationId,fresh);
  });
  await test("coordinator stages and reads back through the real owner/operation-scoped Blob store",async()=>{
   const op=await planned();
   const store=PWACharacterRestoreBlobStore.createCharacterRestoreBlobStore();
   const media={
    async downloadAsset(){return blob},
    async inspectImage(){return {width:40,height:30}},
    stageBlob(input){return store.stageBlob(input)},
    readStagedBlob(input){return store.readStagedBlob(input)}
   };
   const result=await coordinator.stageRestoreReferences({ownerId:owner,operationId:op.operationId,manifest,expectedRevision:op.revision,journal:api,...gate,adapters:media});
   const row=await api.get(owner,op.operationId);
   const ref=row.references[0];
   const saved=await store.readStagedBlob({ownerId:owner,operationId:op.operationId,cloudAssetId:manifest[0].cloudAssetId,localStagedBlobId:ref.localStagedBlobId});
   ok(result.state==="ready_to_activate"&&row.state==="ready_to_activate","real Blob store staging did not complete");
   ok(saved instanceof Blob&&saved.size===blob.size&&ref.state==="verified_staged","real Blob store read-back was not verified");
  });
  await test("real IndexedDB journal + Blob staging reaches ready_to_activate",async()=>{
   const op=await planned();
   const result=await coordinator.stageRestoreReferences({ownerId:owner,operationId:op.operationId,manifest,expectedRevision:op.revision,journal:api,...gate,adapters:adapters()});
   const row=await api.get(owner,op.operationId);
   ok(result.state==="ready_to_activate"&&result.activationRequired,"coordinator did not report staging-only result");
   ok(row.state==="ready_to_activate"&&row.references[0].state==="verified_staged","verified checkpoint missing");
   ok(row.lease===null,"lease remained held after staging");
  });
  await test("real journal rejects tampered staged Blob and keeps retryable checkpoint",async()=>{
   const op=await planned();
   await rejects(()=>coordinator.stageRestoreReferences({ownerId:owner,operationId:op.operationId,manifest,expectedRevision:op.revision,journal:api,...gate,adapters:adapters({tamper:true})}),"tampered Blob accepted");
   const row=await api.get(owner,op.operationId);
   ok(row.state==="paused_retryable"&&row.references[0].state==="pending","failed verification did not pause safely");
   ok(row.lease===null,"failed staging left lease held");
  });
  await test("real journal fences account switch during download",async()=>{
   const op=await planned();let current=true;
   const media=adapters({onDownload:()=>{current=false}});
   await rejects(()=>coordinator.stageRestoreReferences({ownerId:owner,operationId:op.operationId,manifest,expectedRevision:op.revision,journal:api,...gate,adapters:media,isCurrent:()=>current}),"account switch was not fenced");
   const row=await api.get(owner,op.operationId);
   ok(row.state==="staging"&&row.references[0].state==="pending","account-switch checkpoint changed unexpectedly");
   ok(row.lease===null,"account-switch path did not release lease");
  });
  await test("coordinator stages through the real owner-scoped IndexedDB Blob adapter",async()=>{
   const op=await planned(), blobStore=PWACharacterRestoreBlobStore.createCharacterRestoreBlobStore();
   const media={
    async downloadAsset(){return blob},
    async inspectImage(){return {width:40,height:30}},
    stageBlob:blobStore.stageBlob,
    readStagedBlob:blobStore.readStagedBlob
   };
   const result=await coordinator.stageRestoreReferences({ownerId:owner,operationId:op.operationId,manifest,expectedRevision:op.revision,journal:api,...gate,adapters:media});
   const row=await api.get(owner,op.operationId);
   ok(result.state==="ready_to_activate"&&row.references[0].state==="verified_staged","real Blob adapter did not reach verified checkpoint");
   const stagedId=row.references[0].localStagedBlobId;
   const read=await blobStore.readStagedBlob({ownerId:owner,operationId:op.operationId,cloudAssetId:manifest[0].cloudAssetId,localStagedBlobId:stagedId});
   ok(read instanceof Blob&&await digest(read)===sha,"real staged Blob read-back did not preserve bytes");
  });
   await test("retry resumes a paused operation and reuses verified staged media",async()=>{
    const op=await planned();
    await rejects(()=>coordinator.stageRestoreReferences({ownerId:owner,operationId:op.operationId,manifest,expectedRevision:op.revision,journal:api,...gate,adapters:adapters({tamper:true})}),"initial tampered staging unexpectedly succeeded");
    const paused=await api.get(owner,op.operationId);
    ok(paused.state==="paused_retryable","failed operation was not paused");
    const goodStore=PWACharacterRestoreBlobStore.createCharacterRestoreBlobStore();
    const media={
     async downloadAsset(){return blob},
     async inspectImage(){return {width:40,height:30}},
     stageBlob(input){return goodStore.stageBlob(input)},
     readStagedBlob(input){return goodStore.readStagedBlob(input)}
    };
    const resumed=await coordinator.stageRestoreReferences({ownerId:owner,operationId:op.operationId,manifest,expectedRevision:paused.revision,journal:api,...gate,adapters:media});
    const final=await api.get(owner,op.operationId);
    ok(resumed.state==="ready_to_activate"&&final.references[0].state==="verified_staged","paused operation did not resume to verified state");
   });
   await test("manifest MIME, byte size, SHA-256 and dimensions mismatches are rejected",async()=>{
    const variants=[
     {...manifest[0],type:"image/webp",expectedMimeType:"image/webp"},
     {...manifest[0],expectedSizeBytes:blob.size+1},
     {...manifest[0],expectedSha256:"0".repeat(64)},
     {...manifest[0],width:41}
    ];
    for(const badRef of variants){
     const op=await planned();let staged=0;
     const base=adapters();
     const media={...base,async stageBlob(input){staged++;return base.stageBlob(input)}};
     await rejects(()=>coordinator.stageRestoreReferences({ownerId:owner,operationId:op.operationId,manifest:[badRef],expectedRevision:op.revision,journal:api,...gate,adapters:media}),"invalid media manifest proof was accepted");
     const row=await api.get(owner,op.operationId);
     ok(row.state==="paused_retryable"&&staged===0,"invalid media reached persistent staging");
    }
   });
  out.textContent="PASS "+passed.length+" tests\n"+passed.map(x=>"✓ "+x).join("\n");document.documentElement.dataset.testResult="passed";
 }catch(e){out.textContent="FAIL after "+passed.length+" tests\n"+passed.join("\n")+"\n"+(e.stack||e);document.documentElement.dataset.testResult="failed"}
})();
</script></body></html>
