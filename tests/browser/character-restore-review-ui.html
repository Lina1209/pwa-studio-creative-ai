<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><title>Character restore review UI tests</title></head>
<body>
<button id="previewCharacterRestore" type="button">Проверить</button>
<p id="characterRestoreStatus"></p>
<section id="characterRestorePanel" hidden>
<div id="characterRestoreChoices"></div><div id="characterRestorePreview"></div>
</section>
<pre id="results"></pre>
<script>
(() => {
  const assert=(ok,msg)=>{if(!ok)throw new Error(msg);};
  const owner="11111111-1111-4111-8111-111111111111";
  let context=4;
  const calls=[];
  window.PWAStudioCharacterRestoreBridge={
    getSession:()=>({user:{id:owner},access_token:"test-token"}),
    getContextVersion:()=>context,
    getLocalItems:()=>[],
    isCurrent:(id,version)=>id===owner&&version===context
  };
  window.PWACharacterCloudRestore={
    async planRestore(args){
      const page=await args.fetchPage(null);
      const refs=await args.fetchReferences([page.items[0].id]);
      assert(page.items.length===1&&refs.length===1,"review fetches cloud passports and explicit reference catalog");
      return {cloudCount:1,cloudSummary:[{cloudId:page.items[0].id,localId:"33333333-3333-4333-8333-333333333333",name:"<img src=x onerror=alert(1)>",kind:"character",referenceCount:1}]};
    },
    selectRestorePlan({plan}){return plan;},
    buildRestorePreview(){return {
      selectedCount:1,restorableCount:1,unchangedCount:0,conflictCount:0,referenceCount:1,canContinue:true,
      items:[{name:"<img src=x onerror=alert(1)>",statusLabel:"Готово",conflictMessage:"",referencesPending:1,referenceCount:1,referenceStatusLabel:"ожидает"}]
    };}
  };
  window.__reviewTest={calls,assert,owner};
  window.PWAStudioCharacterRestoreBridge.apiRequest=async(path,options={})=>{
    calls.push({path,method:options.method||"GET"});
    return {items:[{id:"22222222-2222-4222-8222-222222222222"}],next_cursor:null};
  };
  const originalApi=window.PWAStudioCharacterRestoreBridge.apiRequest;
  window.PWAStudioCharacterRestoreBridge.apiRequest=async(path,options={})=>{
    calls.push({path,method:options.method||"GET"});
    if(path.startsWith("/api/media/character-references"))return [{id:"99999999-9999-4999-8999-999999999999"}];
    return originalApi(path,options);
  };
})();
</script>
<script src="/character-restore-review-ui.js"></script>
<script>
(async()=>{
  const {calls,assert}=window.__reviewTest;
  const button=document.getElementById("previewCharacterRestore");
  button.click();
  await new Promise(resolve=>setTimeout(resolve,20));
  assert(calls.length===2,"review performs only the expected two read requests");
  assert(calls.every(x=>x.method==="GET"),"review performs no POST, PATCH, DELETE, or other writes");
  assert(calls[0].path.startsWith("/api/characters?")&&calls[1].path.startsWith("/api/media/character-references?"),"review uses owner-scoped cloud list and media catalog endpoints");
  assert(!document.querySelector("#characterRestoreChoices img")&&!document.querySelector("#characterRestorePreview img"),"untrusted cloud names are rendered as text, not HTML");
  assert(document.getElementById("characterRestoreChoices").textContent.includes("<img src=x"),"untrusted cloud name remains visible as literal text");
  assert(!document.getElementById("characterRestorePanel").hidden,"successful review opens the review panel");
  window.dispatchEvent(new Event("pwa-studio-auth-changed"));
  assert(document.getElementById("characterRestorePanel").hidden,"account change closes the review panel");
  assert(document.getElementById("characterRestoreChoices").childElementCount===0,"account change clears previous account choices");
  assert(document.getElementById("characterRestorePreview").childElementCount===0,"account change clears previous account preview");
  document.getElementById("results").textContent="PASS: "+[
    "read-only review requests","GET-only boundary","explicit catalog endpoint",
    "untrusted text rendering","account-change cleanup"
  ].join("\nPASS: ");
  document.documentElement.dataset.testResult="passed";
})().catch(error=>{
  document.getElementById("results").textContent="FAIL: "+(error.stack||error);
  document.documentElement.dataset.testResult="failed";
});
</script>
</body></html>
