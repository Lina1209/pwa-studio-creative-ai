<!doctype html><html lang="en"><meta charset="utf-8"><title>Owner coordination lock tests</title><body><pre id="results">Running…</pre>
<script src="../../character-owner-coordination-lock.js"></script>
<script>
(async()=>{
 const out=document.querySelector("#results"),api=PWACharacterOwnerCoordinationLock,passed=[];
 const owner="11111111-1111-4111-8111-111111111111",other="22222222-2222-4222-8222-222222222222";
 const assert=(v,m)=>{if(!v)throw Error(m)};
 const rejects=async fn=>{let failed=false;try{await fn()}catch{failed=true}assert(failed,"expected rejection")};
 try{
  const [a,b]=await Promise.allSettled([api.acquire(owner,{ttlMs:3000}),api.acquire(owner,{ttlMs:3000})]);
  assert([a,b].filter(x=>x.status==="fulfilled").length===1,"two tabs acquired one owner lock");
  const first=(a.status==="fulfilled"?a:b).value;
  const second=(a.status==="rejected"?a:b);
  await rejects(()=>api.acquire(owner,{ttlMs:3000}));
  assert(await api.isCurrent(first),"fresh owner lease not current");
  passed.push("atomic single-holder acquisition across concurrent tabs");
  const independent=await api.acquire(other,{ttlMs:3000});
  assert(await api.isCurrent(independent),"different owner lock was not independent");
  await api.release(independent);
  passed.push("owner isolation");
  const renewed=await api.renew(first,{ttlMs:3000});
  assert(renewed.epoch===first.epoch&&renewed.expiresAt>first.expiresAt,"renewal changed epoch or failed to extend");
  assert(await api.isCurrent(renewed),"renewed lease was not current");
  passed.push("renewal and stale-token fencing");
  await new Promise(resolve=>setTimeout(resolve,3100));
  const takeover=await api.acquire(owner,{ttlMs:3000});
  assert(takeover.epoch===renewed.epoch+1,"takeover epoch was not monotonic");
  assert(!(await api.isCurrent(renewed)),"old lease remained current after takeover");
  await rejects(()=>api.renew(renewed,{ttlMs:3000}));
  await rejects(()=>api.release(renewed));
  assert(await api.isCurrent(takeover),"new lease not current");
  await api.release(takeover);
  assert(!(await api.isCurrent(takeover)),"released owner lease remained current");
  const afterRelease=await api.acquire(owner,{ttlMs:3000});
  assert(afterRelease.epoch===takeover.epoch+1,"owner epoch reset after a successful release");
  await api.release(afterRelease);
  passed.push("expiry takeover, release tombstone, and monotonic stale-holder fencing");
  // Corrupt persisted state must fail closed rather than concatenate/reset an epoch.
  const corruptOwner="44444444-4444-4444-8444-444444444444";
  const db=await new Promise((resolve,reject)=>{
   const request=indexedDB.open("pwa-studio-character-owner-coordination-v1",1);
   request.onsuccess=()=>resolve(request.result); request.onerror=()=>reject(request.error);
  });
  await new Promise((resolve,reject)=>{
   const tx=db.transaction("locks","readwrite");
   tx.objectStore("locks").put({ownerId:corruptOwner,token:null,epoch:"7",expiresAt:0,protocolVersion:1});
   tx.oncomplete=resolve; tx.onerror=()=>reject(tx.error); tx.onabort=()=>reject(tx.error);
  });
  await rejects(()=>api.acquire(corruptOwner,{ttlMs:3000}));
  await new Promise((resolve,reject)=>{
   const tx=db.transaction("locks","readwrite");
   tx.objectStore("locks").delete(corruptOwner);
   tx.oncomplete=resolve; tx.onerror=()=>reject(tx.error); tx.onabort=()=>reject(tx.error);
  });
  db.close();
  passed.push("malformed persisted lock records fail closed");
  out.textContent="PASS "+passed.length+" tests\n"+passed.map(x=>"✓ "+x).join("\n");
  document.documentElement.dataset.testResult="passed";
 }catch(error){out.textContent="FAIL\n"+passed.join("\n")+"\n"+(error.stack||error);document.documentElement.dataset.testResult="failed"}
})();
</script></body></html>
