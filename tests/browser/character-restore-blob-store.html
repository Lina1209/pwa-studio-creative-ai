<!doctype html>
<html lang="en"><meta charset="utf-8"><title>Restore Blob store browser tests</title>
<body><pre id="results">Running…</pre>
<script src="../../character-restore-blob-store.js"></script>
<script>
(async()=>{
 const out=document.querySelector("#results"), passed=[];
 const owner="11111111-1111-4111-8111-111111111111";
 const other="22222222-2222-4222-8222-222222222222";
 const operation="33333333-3333-4333-8333-333333333333";
 const asset="44444444-4444-4444-8444-444444444444";
 const id="55555555-5555-4555-8555-555555555555";
 const blob=new Blob(["restore-blob-proof"],{type:"image/png"});
 const bytes=await blob.arrayBuffer();
 const hash=await crypto.subtle.digest("SHA-256",bytes);
 const sha=Array.from(new Uint8Array(hash),x=>x.toString(16).padStart(2,"0")).join("");
 const proof={sha256:sha,sizeBytes:blob.size,mimeType:blob.type,width:32,height:24};
 const api=PWACharacterRestoreBlobStore.createCharacterRestoreBlobStore();
 const assert=(v,m)=>{if(!v)throw Error(m)};
 const rejects=async fn=>{let did=false;try{await fn()}catch{did=true}assert(did,"expected rejection")};
 try{
  const first=await api.stageBlob({ownerId:owner,operationId:operation,cloudAssetId:asset,localStagedBlobId:id,blob,proof});
  assert(first.localStagedBlobId===id&&!first.reused,"new staged Blob was not written");
  const read=await api.readStagedBlob({ownerId:owner,operationId:operation,cloudAssetId:asset,localStagedBlobId:id});
  assert(read instanceof Blob&&read.size===blob.size&&read.type===blob.type,"owner could not read staged Blob");
  passed.push("owner-scoped staged Blob write/read");
  const again=await api.stageBlob({ownerId:owner,operationId:operation,cloudAssetId:asset,localStagedBlobId:id,blob,proof});
  assert(again.reused,"identical operation retry was not idempotent");
  passed.push("idempotent same-operation retry");
  assert(await api.readStagedBlob({ownerId:other,operationId:operation,cloudAssetId:asset,localStagedBlobId:id})===null,"cross-owner read was allowed");
  assert(await api.readStagedBlob({ownerId:owner,operationId:other,cloudAssetId:asset,localStagedBlobId:id})===null,"cross-operation read was allowed");
  passed.push("owner and operation isolation");
  await rejects(()=>api.stageBlob({ownerId:other,operationId:operation,cloudAssetId:asset,localStagedBlobId:id,blob,proof}));
  await rejects(()=>api.stageBlob({ownerId:owner,operationId:operation,cloudAssetId:asset,localStagedBlobId:id,blob,proof:{...proof,sha256:"0".repeat(64)}}));
  passed.push("collision and invalid proof rejected");
  await rejects(()=>api.deleteStagedBlob({ownerId:owner,operationId:operation,cloudAssetId:asset,localStagedBlobId:id,inspectImage:async()=>({width:32,height:24}),beforeDelete:async()=>{throw new Error("lock lost")},proof}));
  assert(await api.readStagedBlob({ownerId:owner,operationId:operation,cloudAssetId:asset,localStagedBlobId:id}) instanceof Blob,"pre-delete guard rejection removed the Blob");
  passed.push("pre-delete fencing guard blocks mutation");
  assert(await api.deleteStagedBlob({ownerId:other,operationId:operation,cloudAssetId:asset,localStagedBlobId:id,inspectImage:async()=>({width:32,height:24}),proof})==="missing","cross-owner delete did not fail closed");
  assert(await api.deleteStagedBlob({ownerId:owner,operationId:other,cloudAssetId:asset,localStagedBlobId:id,inspectImage:async()=>({width:32,height:24}),proof})==="missing","cross-operation delete did not fail closed");
  await rejects(()=>api.deleteStagedBlob({ownerId:owner,operationId:operation,cloudAssetId:asset,localStagedBlobId:id,inspectImage:async()=>({width:32,height:24}),proof:{...proof,sha256:"0".repeat(64)}}));
  const tamperDb=await new Promise((resolve,reject)=>{const q=indexedDB.open("pwa-studio-character-library-v1",1);q.onsuccess=()=>resolve(q.result);q.onerror=()=>reject(q.error)});
  try{await new Promise((resolve,reject)=>{const tx=tamperDb.transaction("images","readwrite"),store=tx.objectStore("images"),q=store.get(id);q.onsuccess=()=>{const row=q.result;row.blob=new Blob(["changed-blob-proof"],{type:"image/png"});store.put(row)};tx.oncomplete=resolve;tx.onerror=()=>reject(tx.error)})}finally{tamperDb.close()}
  await rejects(()=>api.deleteStagedBlob({ownerId:owner,operationId:operation,cloudAssetId:asset,localStagedBlobId:id,inspectImage:async()=>({width:32,height:24}),proof}));
  const stillTampered=await api.readStagedBlob({ownerId:owner,operationId:operation,cloudAssetId:asset,localStagedBlobId:id});
  assert(stillTampered instanceof Blob,"checksum mismatch deleted the staged Blob");
  const restoreDb=await new Promise((resolve,reject)=>{const q=indexedDB.open("pwa-studio-character-library-v1",1);q.onsuccess=()=>resolve(q.result);q.onerror=()=>reject(q.error)});
  try{await new Promise((resolve,reject)=>{const tx=restoreDb.transaction("images","readwrite"),store=tx.objectStore("images"),q=store.get(id);q.onsuccess=()=>{const row=q.result;row.blob=blob;store.put(row)};tx.oncomplete=resolve;tx.onerror=()=>reject(tx.error)})}finally{restoreDb.close()}
  assert(await api.readStagedBlob({ownerId:owner,operationId:operation,cloudAssetId:asset,localStagedBlobId:id}) instanceof Blob,"rejected deletion changed the stored Blob");
  const deleted=await api.deleteStagedBlob({ownerId:owner,operationId:operation,cloudAssetId:asset,localStagedBlobId:id,inspectImage:async()=>({width:32,height:24}),proof});
  assert(deleted==="deleted","exact owner/operation/asset/proof deletion failed");
  assert(await api.readStagedBlob({ownerId:owner,operationId:operation,cloudAssetId:asset,localStagedBlobId:id})===null,"exactly deleted Blob remains readable");
  assert(await api.deleteStagedBlob({ownerId:owner,operationId:operation,cloudAssetId:asset,localStagedBlobId:id,inspectImage:async()=>({width:32,height:24}),proof})==="missing","exact delete retry was not idempotent");
  passed.push("exact-key deletion rejects cross-owner, cross-operation, and proof mismatch; retry is idempotent");
  out.textContent="PASS "+passed.length+" tests\n"+passed.map(x=>"✓ "+x).join("\n");
  document.documentElement.dataset.testResult="passed";
 }catch(e){out.textContent="FAIL after "+passed.length+" tests\n"+passed.join("\n")+"\n"+(e.stack||e);document.documentElement.dataset.testResult="failed"}
})();
</script></body></html>
