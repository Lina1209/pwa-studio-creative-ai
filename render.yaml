services:
  - type: web
    name: pwa-studio-creative-ai-api
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: .
    healthCheckPath: /api/health
    envVars:
      - key: APP_ENV
        value: production
      - key: APP_NAME
        value: PWA Studio API
      - key: CORS_ORIGINS
        value: https://lina1209.github.io
      - key: AI_PROVIDER
        value: deepseek
      - key: AI_MODEL
        value: deepseek-flash
      - key: OPENAI_API_KEY
        sync: false
      - key: DEEPSEEK_API_KEY
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: OLLAMA_API_BASE
        value: http://localhost:11434
