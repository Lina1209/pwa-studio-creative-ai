services:
  - type: web
    name: pwa-studio-creative-ai
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: .
    healthCheckPath: /api/health
    envVars:
      - key: APP_ENV
        value: production
      - key: APP_NAME
        value: PWA Studio API
      - key: CORS_ORIGINS
        value: https://lina1209.github.io
      - key: AI_PROVIDER
        value: deepseek
      - key: AI_MODEL
        value: deepseek-flash
      - key: AI_MAX_CONCURRENT_REQUESTS
        value: "4"
      - key: AI_QUEUE_WAIT_SECONDS
        value: "10"
      - key: AI_REQUEST_TIMEOUT_SECONDS
        value: "90"
      - key: AI_MAX_RETRIES
        value: "1"
      - key: DEEPSEEK_API_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: OWNER_USER_IDS
        sync: false
